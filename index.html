<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Control de gastos Ju</title>
  <meta name="description" content="Control personal de pagos mensuales.">
  <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1412" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gastos Ju">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="appbar">
    <div class="appbar-row">
      <h1 id="titulo">Este mes</h1>
      <span class="appname">Gastos Ju</span>
    </div>
    <div class="month-nav" id="monthNav">
      <button type="button" class="icon-btn" data-action="mes-anterior" aria-label="Mes anterior">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="month-center">
        <span class="month-label" id="mesLabel"></span>
        <button type="button" class="link-btn" id="irHoy" data-action="mes-actual" hidden>Ir al mes actual</button>
      </div>
      <button type="button" class="icon-btn" data-action="mes-siguiente" aria-label="Mes siguiente">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </header>

  <div class="storage-banner" id="storageBanner" role="alert" hidden>
    No se pudo guardar en este dispositivo. Revisá que el navegador no esté en modo incógnito y exportá un respaldo.
  </div>

  <main id="main" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Secciones">
    <button type="button" data-tab="mes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>Mes</span>
    </button>
    <button type="button" data-tab="resumen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M7 16v-5M12 16V6M17 16v-8"/></svg>
      <span>Resumen</span>
    </button>
    <button type="button" data-tab="historial">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5"/><path d="M3.5 3.5v5h5M12 7.5V12l3 2"/></svg>
      <span>Historial</span>
    </button>
    <button type="button" data-tab="config">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
      <span>Ajustes</span>
    </button>
  </nav>

  <dialog id="sheet" class="sheet" aria-labelledby="sheetTitle"></dialog>

  <dialog id="confirm" class="confirm">
    <form method="dialog">
      <h2 id="confirmTitle"></h2>
      <p id="confirmMsg"></p>
      <div class="btn-row">
        <button value="cancel" class="btn btn-secondary" id="confirmCancel">Cancelar</button>
        <button value="ok" class="btn btn-primary" id="confirmOk">Aceptar</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span id="toastMsg"></span>
    <button type="button" id="toastAction" hidden></button>
  </div>

  <input type="file" id="importFile" accept="application/json,.json" hidden>
</body>
</html>
